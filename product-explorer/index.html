<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>Product Explorer</h1>
    <p>Click "View Product" on any item. Your last 5 views are remembered below.</p>
  </header>

  <main>
    <!-- Recently Viewed -->
    <section class="section">
      <div class="section-head">
        <h2>Recently Viewed</h2>
        <button id="clearHistoryBtn" class="btn btn-ghost">Clear History</button>
      </div>
      <div id="recentlyViewed" class="recent-row"></div>
    </section>

    <!-- All Products -->
    <section class="section">
      <h2>All Products</h2>
      <div id="productGrid" class="product-grid"></div>
    </section>
  </main>

  <!-- Product detail modal -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true">
      <button id="closeModalBtn" class="modal-close" aria-label="Close">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
